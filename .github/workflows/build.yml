name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Kalau kamu upload project.zip (cara termudah dari HP), zip-nya dibuka dulu.
      # Kalau kamu upload folder proyek langsung, langkah ini dilewati.
      - name: Siapkan proyek
        run: |
          if [ -f project.zip ]; then
            mkdir -p _proj
            unzip -q -o project.zip -d _proj
            echo "PROJ=_proj" >> "$GITHUB_ENV"
          else
            echo "PROJ=." >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTranslate-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
